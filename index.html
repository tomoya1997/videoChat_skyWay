<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWay Video Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pure-g">
        <!-- Video area -->
        <div class="pure-u-2-3" id="video-container">
            <video id="their-video" autoplay></video>
            <video id="my-video" muted="true" autoplay></video>
        </div>

        <!-- Steps -->
        <div class="pure-u-1-3">
            <h2>SkyWay Video Chat</h2>

            <p>Your id: <span id="my-id">...</span></p>
            <p>Share this id with others so they can call you.</p>
            <h3>Make a call</h3>
            <form id="make-call" class="pure-form">
                <input type="text" placeholder="Call user id..." id="callto-id">
                <button type="submit" class="pure-button pure-button-success">Call</button>
            </form>
            <form id="end-call" class="pure-form">
                <p>Currently in call with <span id="their-id">...</span></p>
                <button type="submit" class="pure-button pure-button-success">End Call</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.webrtc.ecl.ntt.com/skyway-latest.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
